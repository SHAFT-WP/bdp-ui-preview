name: Build BDP standalone once

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/build-standalone-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work

      - name: Bundle runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 bdp-app.mjs             --bundle             --format=esm             --platform=browser             --target=es2022             --outfile=/tmp/bdp.bundle.js
          cat common/ui/value-states-v0.1.css bdp-ui.css > /tmp/bdp.bundle.css

      - name: Build single-file HTML
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');
          const css = fs.readFileSync('/tmp/bdp.bundle.css', 'utf8').replace(/<\/style/gi, '<\\/style');
          const js = fs.readFileSync('/tmp/bdp.bundle.js', 'utf8').replace(/<\/script/gi, '<\\/script');

          html = html
            .replace(/\s*<link\s+rel=["']stylesheet["']\s+href=["']\.\/common\/ui\/value-states-v0\.1\.css[^"']*["']\s*>\s*/i, '\n')
            .replace(/\s*<link\s+rel=["']stylesheet["']\s+href=["']\.\/bdp-ui\.css[^"']*["']\s*>\s*/i, '\n')
            .replace('</head>', `<style>\n${css}\n</style>\n</head>`)
            .replace(/<script\s+type=["']module["']\s+src=["']\.\/bdp-app\.mjs[^"']*["']\s*><\/script>/i,
              `<script type="module">\n${js}\n</script>`);

          if (/<link\b[^>]*rel=["']stylesheet["']/i.test(html)) {
            throw new Error('stylesheet link remains in standalone');
          }
          if (/<script\b[^>]*\bsrc=["']/i.test(html)) {
            throw new Error('external script src remains in standalone');
          }
          if (/\.\/bdp-app\.mjs|\.\/bdp-ui\.css|\.\/common\//.test(html)) {
            throw new Error('runtime file reference remains in standalone');
          }

          fs.writeFileSync('bdp-standalone.html', html);
          NODE

      - name: Verify standalone
        shell: bash
        run: |
          set -euo pipefail
          test -s bdp-standalone.html
          grep -Fq '<script type="module">' bdp-standalone.html
          grep -Fq '<style>' bdp-standalone.html
          ! grep -Eq '<script[^>]+src=' bdp-standalone.html
          ! grep -Eq '<link[^>]+rel=["'"'"']stylesheet' bdp-standalone.html

      - name: Commit standalone and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-standalone-once.yml
          git add bdp-standalone.html
          git commit -m "Add BDP standalone HTML"
          git push origin HEAD:work
