name: Export standalone HTMLs

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/export-standalone-htmls.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BDP work
        uses: actions/checkout@v4
        with:
          ref: work
          path: bdp

      - name: Check out Offset work
        uses: actions/checkout@v4
        with:
          repository: SHAFT-WP/offset-ui-preview
          ref: work
          path: offset

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          cp bdp/bdp-standalone.html out/BDP_standalone.html
          cp offset/offset-standalone.html out/Offset_standalone.html
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-htmls
          path: out/*
          if-no-files-found: error
